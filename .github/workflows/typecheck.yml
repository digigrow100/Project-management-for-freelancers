name: Typecheck

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: node tests/hosting-workspaces.cjs
      - run: node tests/hosting-security.cjs
      - run: node tests/hosting-client-scope.cjs
      - run: node tests/member-view-security.cjs
      - run: node tests/hosting-client-view.cjs

      - run: node tests/security-hardening.cjs
      - run: node tests/hosting-mfa-actions.cjs

      - run: node tests/hosting-bridge-reports.cjs
      - run: node tests/hosting-bridge-access.cjs

      - run: node tests/hosting-operator-protocol.cjs
      - run: npm install --prefix /tmp/hms-operator-test-deps --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.5.10
      - run: NODE_PATH=/tmp/hms-operator-test-deps/node_modules node tests/hosting-operator-database.cjs
