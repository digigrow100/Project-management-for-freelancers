name: Typecheck

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types tests/extension-request-backoff.cjs
      - run: node --test tests/extension-batch-matching.cjs tests/visible-polling.cjs
      - run: node --experimental-strip-types --test tests/operator-controls.test.cjs tests/operator-upload.test.cjs tests/hosting-operator-protocol.cjs tests/backupProtocol.test.mjs tests/manager.test.cjs tests/client-release.test.cjs
      - run: node tests/hosting-operator-database.cjs
      - run: node --test tests/hosting-domain-security.cjs tests/hosting-login-routing.cjs tests/admin-network.cjs
      - run: npm run typecheck
      - run: npm run lint
      - run: node tests/hosting-workspaces.cjs
      - run: node tests/hosting-panel-catalog.cjs
      - name: Parse Windows relay installer
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/dynadot-relay/Install-HouseMySiteDynadotRelay.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/email/Check-HouseMySiteMail.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/email/Start-HouseMySiteMailSigner.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/email/Install-EmailControlCenter.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
      - run: node tests/hosting-registrar-relay.cjs
      - run: python3 -m unittest discover -s tests -p test_dynadot_relay.py -v
      - name: Install disposable Apache test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y apache2
      - run: HMS_REQUIRE_APACHE=1 python3 tests/hosting-relay-apache.py
      - run: node tests/hosting-registrar.cjs
      - run: node tests/hosting-registrar-ui.cjs
      - run: node tests/hosting-email.cjs
      - run: node tests/hosting-email-db.cjs
      - run: node tests/email-services-db.cjs
      - run: python3 -m pip install cryptography==46.0.3
      - run: python3 -m unittest discover -s tests -p 'test_mail*.py' -v
      - run: python3 -m py_compile scripts/email/inspect_mail_readiness.py
      - name: Install isolated pinned browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/hms-browser-tools" --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          printf 'NODE_PATH=%s/hms-browser-tools/node_modules\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: node "$RUNNER_TEMP/hms-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - run: node local-checks/domain-workspace-browser.cjs
      - run: node local-checks/email-workspace-browser.cjs
      - run: node local-checks/email-services-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: email-services-browser
          path: email-services-browser-output/
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: email-workspace-browser
          path: email-browser-output/
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domain-workspace-browser
          path: domain-browser-output/
          retention-days: 3
      - run: node tests/hosting-registrar-db.cjs
      - run: node tests/hosting-ui.cjs
      - run: node tests/hosting-service-status.cjs
      - run: node tests/hosting-service-status-ui.cjs
      - run: node tests/hosting-package-contracts.cjs
      - run: node tests/hosting-package-views.cjs
      - run: node tests/hosting-limits-fixture.cjs
      - run: node tests/hosting-app-accounts.cjs
      - run: node tests/hosting-app-accounts-rollback.cjs
      - run: node tests/hosting-app-provisioning.cjs
      - run: node tests/hosting-security.cjs
      - run: node tests/hosting-client-scope.cjs
      - run: node tests/hosting-provisioning.cjs
      - run: node tests/hosting-primary-domain.cjs
      - run: node tests/member-view-security.cjs
      - run: node tests/hosting-client-view.cjs

      - run: node tests/security-hardening.cjs
      - run: node tests/hosting-mfa-actions.cjs

      - run: node tests/hosting-bridge-reports.cjs
      - run: node tests/hosting-bridge-access.cjs


      - name: Build with isolated non-production settings
        run: python3 local-checks/build-isolated.py

