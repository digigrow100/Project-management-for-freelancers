name: Mail launcher Windows transport
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/email/**
      - tests/windows-mail-launcher.ps1
      - tests/test_mail_readiness.py
      - tests/test_mail_enrollment.py
      - .github/workflows/mail-launcher-windows.yml
  workflow_dispatch:
jobs:
  native-ssh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 native SSH stdin
        shell: powershell
        run: ./tests/windows-mail-launcher.ps1
      - name: PowerShell 7 native SSH stdin
        shell: pwsh
        run: ./tests/windows-mail-launcher.ps1

  readiness-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install cryptography==46.0.3
      - name: Independent read-only report sections and safe errors
        run: |
          python3 -m unittest discover -s tests -p test_mail_readiness.py -v
          python3 -m unittest discover -s tests -p 'test_mail*.py' -v
